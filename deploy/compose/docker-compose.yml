# P1.25 — Local developer Compose stack (report §21.1 local-developer mode).
#
# Services: postgres (18.6, pinned), nats (2.15.2, pinned, JetStream file
# store), control-plane (built from the workspace, migrations run at
# startup by the control plane itself — recorded decision: the separate
# migrate service is unnecessary because FlexCoreStore::run_migrations
# runs embedded migrations on boot), worker.
#
# DEV-ONLY credentials below — clearly marked, never production. The
# production secrets path is a secrets manager (P0.16/P1.21); these values
# exist so a developer checkout starts with no manual steps.
#
# Image tags are pinned EXACT versions — never `latest`, never `x`
# wildcards (P1.25 acceptance). NATS 2.15.2 was the latest 2.15 patch at
# the 2026-11-07 cut-off; re-check at build time (RESEARCH.md §5) and
# record the resolved tag in the README.
#
# Streams: the NATS adapter provisions the Phase 1 streams
# (REGISTRY/STATE/AUDIT + FLEXCORE_DLQ) on first use per the P1.14 design
# (§4); no manual stream setup is required.

services:
  postgres:
    image: postgres:18.6
    environment:
      # DEV-ONLY credential — not a production secret.
      POSTGRES_USER: flexcore_dev
      # DEV-ONLY credential — not a production secret.
      POSTGRES_PASSWORD: flexcore_dev_password
      POSTGRES_DB: flexcore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexcore_dev -d flexcore"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15.2
    command: ["--jetstream", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      # JetStream-enabled monitor endpoint answers on :8222.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/compose/control-plane.Dockerfile
    environment:
      FLEXCORE_DATABASE_URL: postgres://flexcore_dev:flexcore_dev_password@postgres:5432/flexcore
      FLEXCORE_NATS_URL: nats://nats:4222
      FLEXCORE_BIND_ADDR: 0.0.0.0:8080
      FLEXCORE_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /health is liveness (process up); /ready requires the dependencies.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/worker.Dockerfile
    environment:
      FLEXCORE_DATABASE_URL: postgres://flexcore_dev:flexcore_dev_password@postgres:5432/flexcore
      FLEXCORE_NATS_URL: nats://nats:4222
      FLEXCORE_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  nats-data:
