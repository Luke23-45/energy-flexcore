# P1.25 — Local developer Compose stack (report §21.1 local-developer mode).
#
# Services: postgres (18.6, pinned), nats (2.15.2, pinned, JetStream file
# store), control-plane (built from the workspace, migrations run at
# startup by the control plane itself — recorded decision: the separate
# migrate service is unnecessary because FlexCoreStore::run_migrations
# runs embedded migrations on boot), worker.
#
# P11.16 — THE COMPOSE SECRETS FLOOR (WRITTEN, NEVER RUN — the loop bans
# forbid docker commands in this program; the first human run is the
# gate). Credentials no longer live in THIS file: each Compose host that
# needs a secret reads it from a FILE under ./secrets/ (gitignored; each
# host gets its own file — the file-per-host floor), mounted through the
# Compose `secrets:` mechanism, never through `.env` or environment
# values. RESTRICTED PERMISSIONS ARE A HUMAN DEPLOYMENT STEP: create the
# files with `chmod 600` (owner read/write only) — see
# ./secrets/README.md for the exact procedure and the production posture
# (a secrets manager with dynamic short-lived credentials [S-74][S-75] is
# the recorded Vault DEFAULT; this floor is the Compose-shape minimum,
# not the production answer). NATS remains unauthenticated in the DEV
# stack: NATS credential deployment is part of the Vault DEFAULT
# recommendation (P11.16 record), deliberately not faked here.
#
# Image tags are pinned EXACT versions — never `latest`, never `x`
# wildcards (P1.25 acceptance). NATS 2.15.2 was the latest 2.15 patch at
# the 2026-11-07 cut-off; re-check at build time (RESEARCH.md §5) and
# record the resolved tag in the README.
#
# FRV1-R8-001 (final review) — the `observability` PROFILE: three
# additional services below (prometheus, grafana, nats-exporter) wire the
# shipped P11.09 dashboards/datasource/rules tree
# (deploy/compose/observability/) to live consumers — the P11.09 record
# §4 handoff that had been silently dropped. INERT BY DEFAULT (the
# recorded INERT-until-trigger pattern from the k8s/GitOps artifacts):
# Compose profiles only start when requested —
# `docker compose --profile observability up`. NOTHING here has ever been
# pulled, built, or run (the loop bans docker commands; the first human
# run is the gate), and the image tags were version-CHECKED (release
# indexes, 2026-11-18) but are ASSUMPTIONS exactly like the
# otel-collector pin below — re-verify at the first build. The scrape and
# rule configuration lives in deploy/compose/observability/prometheus/
# prometheus.yml (the store-selection note P11-E-2 is recorded there and
# stays OPEN).
#
# Streams: the NATS adapter provisions the Phase 1 streams
# (REGISTRY/STATE/AUDIT + FLEXCORE_DLQ) on first use per the P1.14 design
# (§4); no manual stream setup is required.

secrets:
  # The password the Postgres SERVER initializes its dev superuser with
  # (file content becomes POSTGRES_PASSWORD_FILE). DEV-ONLY placeholder
  # values are allowed in these files; the files themselves are
  # gitignored and must be 0600.
  postgres_server_password:
    file: ./secrets/postgres_server_password.txt
  # The password the control plane and worker present to Postgres
  # (composed into FLEXCORE_DATABASE_URL by the service entrypoint shim).
  postgres_app_password:
    file: ./secrets/postgres_app_password.txt

services:
  postgres:
    image: postgres:18.6
    secrets:
      - postgres_server_password
    environment:
      # DEV-ONLY role name — not a secret.
      POSTGRES_USER: flexcore_dev
      # P11.16: the password arrives as a mounted secret FILE (the
      # official image's *_FILE convention) — never an environment value.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_server_password
      POSTGRES_DB: flexcore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexcore_dev -d flexcore"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15.2
    # Patch B (P2.07): the server now runs from nats-server.conf (TLS,
    # authorization users, JetStream encryption at rest) instead of CLI
    # flags. See that file's header + VERIFY-BUILD list before the first
    # start (certs to provision, TLS 1.3 minimum key, JetStream key
    # spelling); the server fails fast without them, never silently
    # plaintext.
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      # Environment substitution inside nats-server.conf ($VAR expansion
      # by the server at parse time). Values come from the host .env (see
      # .env.example); unset = Compose fails here, before any container
      # starts.
      JETSTREAM_ENCRYPTION_KEY: ${JETSTREAM_ENCRYPTION_KEY:?JETSTREAM_ENCRYPTION_KEY is required (see .env.example)}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:?NATS_WORKER_PASSWORD is required (see .env.example)}
      NATS_SOURCE_PASSWORD: ${NATS_SOURCE_PASSWORD:?NATS_SOURCE_PASSWORD is required (see .env.example)}
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:?NATS_CONTROL_PLANE_PASSWORD is required (see .env.example)}
    volumes:
      - nats-data:/data
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      # Server TLS material, provisioned by the operator before the first
      # start (see nats-server.conf header). Compose creates the
      # directory empty if absent — the server then fails fast, which is
      # the intended posture (never silently plaintext).
      - ./secrets/nats-certs:/etc/nats/certs:ro
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      # JetStream-enabled monitor endpoint answers on :8222.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # P11.06 — the OTel Collector GATEWAY (Phase 11 wave 1, Agent A): the
  # single gateway container shape [S-64]; control plane and worker
  # export OTLP here. Config: ./otel-collector-config.yaml in this
  # directory (head/parent-based sampling at the SDKs; NO tail sampling —
  # deferred with its recorded trigger; the `debug` exporter is the
  # recorded placeholder until P11-E-2 closes). WRITTEN-UNRUN: never
  # pulled or built in this program (the loop bans docker pulls) — the
  # tag is pinned from the release index, checked 2026-11-14 (v0.165.0,
  # released 2026-11-07), re-verify at first build.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Loopback-only host exposure: the OTLP receivers are for the
      # Compose services; a host tool may inspect them from localhost.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/compose/control-plane.Dockerfile
    secrets:
      - postgres_app_password
    environment:
      # P11.16: FLEXCORE_DATABASE_URL is composed by the entrypoint shim
      # below from the mounted secret file — the URL with its credential
      # never appears in this file, in .env, or in `docker inspect`
      # environment output (the shim composes it in-process and execs the
      # binary). The URL embeds the dev role name and host; only the
      # password comes from the secret.
      FLEXCORE_NATS_URL: tls://nats:4222
      FLEXCORE_BIND_ADDR: 0.0.0.0:8080
      FLEXCORE_LOG_LEVEL: info
      # P11.04 (Phase 11 wave 1, Agent A) — OTLP export to the gateway
      # (unset would keep the plain P1.20 JSON subscriber).
      FLEXCORE_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      FLEXCORE_OTEL_SERVICE_NAME: flexcore-control-plane
      FLEXCORE_OTEL_TRACE_SAMPLE_RATIO: "1.0"
    # P11.16 entrypoint shim: composes the database URL from the mounted
    # secret file, exports it for the real ENTRYPOINT binary, and execs it
    # (PID 1 stays the control plane, so signals and the healthcheck are
    # unchanged). WRITTEN-UNRUN (no docker command runs in this program).
    entrypoint:
      - /bin/sh
      - -c
      - |
        FLEXCORE_DATABASE_URL="postgres://flexcore_dev:$$(cat /run/secrets/postgres_app_password)@postgres:5432/flexcore"
        export FLEXCORE_DATABASE_URL
        exec /usr/local/bin/flexcore-control-plane
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      # service_started (not healthy): an OTLP exporter build does not
      # dial the gateway, and export failures are retried by the SDK —
      # the collector is a forwarder, not a liveness dependency.
      otel-collector:
        condition: service_started
    healthcheck:
      # /health is liveness (process up); /ready requires the dependencies.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/worker.Dockerfile
    secrets:
      - postgres_app_password
    environment:
      # P11.16: same entrypoint-shim pattern as the control plane — the
      # database URL with its credential is composed from the mounted
      # secret file at start, never stored in this file.
      FLEXCORE_NATS_URL: tls://nats:4222
      FLEXCORE_LOG_LEVEL: info
      # Patch B (P2.07): local-dev source-auth posture — the worker
      # verifies `dev` envelopes against an ephemeral in-process keypair
      # (the simulator signs with it). Enforced mode is the default when
      # this is unset; do not use dev-key past local development. The
      # tls:// URL above is what the server's TLS listener requires.
      FLEXCORE_SOURCE_AUTH_MODE: dev-key
      FLEXCORE_PROBE_ADDR: 0.0.0.0:8081
      # P11.05 (Phase 11 wave 1, Agent A) — OTLP export to the gateway.
      FLEXCORE_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      FLEXCORE_OTEL_SERVICE_NAME: flexcore-worker
      FLEXCORE_OTEL_TRACE_SAMPLE_RATIO: "1.0"
    # P11.16 entrypoint shim (see the control-plane service note).
    entrypoint:
      - /bin/sh
      - -c
      - |
        FLEXCORE_DATABASE_URL="postgres://flexcore_dev:$$(cat /run/secrets/postgres_app_password)@postgres:5432/flexcore"
        export FLEXCORE_DATABASE_URL
        exec /usr/local/bin/flexcore-worker
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      # service_started: same forwarder-not-dependency note as above.
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # FRV1-R8-001 (final review) — the observability profile services.
  # The long-term metrics store: PROMETHEUS (dev-profile provisional
  # shape; P11-E-2 stays OPEN — see the config file's note). Image pin:
  # prometheus v3.16.0 (the current stable 3.x release tag on the
  # Prometheus release index, checked 2026-11-18; ASSUMPTION exactly like
  # the otel-collector pin — re-verify at the first human build).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The four shipped rule files (P11.03 burn-rate + recording rules,
      # P11.13 DLQ-depth and protocol-adapter alerts) — the rule_files
      # glob in the config above is the repository's ONLY reference to
      # them (the P11.09 record §3 item 3 handoff, closed here).
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      # Loopback-only host exposure (the otel-collector pattern): a host
      # tool may inspect the store from localhost.
      - "127.0.0.1:9090:9090"
    depends_on:
      # The exporters/agents are scrape TARGETS, not liveness
      # dependencies: Prometheus starts fine before them and the scrape
      # failures stay visible as `up == 0`.
      nats-exporter:
        condition: service_started

  # The NATS JetStream exporter the DLQ-depth rule files need
  # (`jetstream_stream_messages{stream=...}`): scrapes the NATS monitor
  # endpoint (:8222, already exposed by the base stack) and serves
  # Prometheus metrics on :7777. Image pin: natsio/prometheus-nats-exporter
  # 0.20.3 (the exporter's current release tag on its release index,
  # checked 2026-11-18; ASSUMPTION like the pins above — re-verify at the
  # first build). RECORDED CAVEAT (unchanged, P11.13 + rule-file header):
  # the exact exported family names are UNVERIFIED against a live
  # exporter; the first human run confirms or mechanically renames the
  # families in the DLQ rules.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.3
    profiles: ["observability"]
    command: ["-varz", "-jsz", "-listen", ":7777"]
    # -jsz needs the JetStream account/layered mode flag on server 2.x
    # (VERIFY-BUILD at the first human run, the adapter's protocol-constant
    # discipline); `-varz` is the monitor surface both the DLQ rules and
    # the base healthcheck read.
    ports:
      # Scrape target inside the Compose network only; loopback for a
      # host tool.
      - "127.0.0.1:7777:7777"

  # The dashboards UI over the shipped provisioning tree (P11.09):
  # datasource provisioning → /etc/grafana/provisioning, dashboards →
  # /var/lib/grafana/dashboards (the recorded mounts of the P11.09 §4
  # handoff). The datasource file names `http://prometheus:9090` — with
  # this profile that service EXISTS in the stack (the FRV1-R8-001
  # mismatch is closed). Image pin: grafana 13.3.1 (the current stable
  # release tag on Grafana's release index, checked 2026-11-18;
  # ASSUMPTION like the pins above — re-verify at the first build).
  # Anonymous admin access is NOT configured: Grafana's shipped default
  # (admin/admin, forced change on first login) applies; a real
  # deployment configures its own auth (an operator concern, not faked
  # here).
  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Loopback-only host exposure (the otel-collector pattern).
      - "127.0.0.1:3000:3000"
    depends_on:
      # The datasource is provisioned statically; Grafana starts fine
      # before the store answers (the panel queries fail visibly until
      # Prometheus is up).
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
