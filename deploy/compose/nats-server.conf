# Patch B (P2.07) — NATS server configuration for the FlexCore Compose
# stack (nats 2.15.2, pinned in docker-compose.yml).
#
# WRITTEN, NEVER RUN (the repo's compose posture: no docker command runs
# in this program; the first human run is the gate). Validate before
# every rollout: `nats-server -t -c deploy/compose/nats-server.conf`.
#
# What this file does:
# - TLS on the client listener (server certificate + private key + CA
#   from mounted secrets; NEVER committed — the files under
#   ./secrets/nats-certs/ are provisioned by the operator, see
#   .env.example and the compose README section). Client certificates
#   are NOT required on this listener: clients authenticate with the
#   user/password authorization below, and the server proves itself to
#   the client. Mutual TLS for edge agents is the SEPARATE P6.07
#   rustls mTLS channel (the edge agent's own transport); it is NOT
#   re-implemented here and this listener does not serve it.
# - Authorization users with least-privilege subject permissions, in the
#   repo's real subject namespace (`flexcore.v1.<area>.>` — see
#   crates/adapters/nats/src/topology.rs; the bare `telemetry.>` form
#   does not exist in this codebase). Passwords arrive by environment
#   substitution from the container environment (set from .env / the
#   deployment's secret handling — never committed; see .env.example).
# - JetStream encryption at rest via ${JETSTREAM_ENCRYPTION_KEY}
#   (never a committed key; generation is documented in .env.example).
#
# VERIFY-BUILD (first human run, before trusting this file):
# 1. TLS 1.3 minimum: no server config key for the minimum TLS version
#    could be verified against the NATS 2.15 docs (the docs name the
#    TLS block keys cert_file/key_file/ca_file/timeout/verify and the
#    client-side enforcement is `ConnectOptions::require_tls(true)` plus
#    a `tls://` URL in apps/worker/src/main.rs). Do NOT guess a key —
#    confirm the pinned 2.15.2 server's minimum-version key with
#    `nats-server -t` and add it here.
# 2. JetStream key spelling: the Encryption & TLS guide
#    (docs.nats.io/learn/security/encryption) writes `key: $JS_KEY` in
#    the jetstream block, while the config reference page names the
#    same setting `encryption_key` (with `prev_encryption_key` for
#    rotation). This file uses the guide's `key:` form; confirm with
#    `nats-server -t` which spelling 2.15.2 accepts and correct this
#    file if it is the other one.
# 3. Certificates: provision ./secrets/nats-certs/server-cert.pem,
#    server-key.pem, and ca.pem (0600, server cert SAN covering `nats`,
#    the name clients dial) before the first start; until then the nats
#    service fails fast at startup — never silently plaintext. The
#    worker and control-plane clients must also trust the CA (their
#    `tls://` URLs + the worker's `require_tls(true)` enforce TLS, but
#    no custom root/client certificate is wired in code yet — see the
#    VERIFY-BUILD note in apps/worker/src/main.rs).
# 4. The `nats-exporter` (observability profile) reads the monitor
#    endpoint on :8222, which this file keeps as plaintext HTTP on the
#    Compose network only (the top-level tls block does not touch the
#    monitor listener, per the NATS docs).

server_name: flexcore-nats
listen: 0.0.0.0:4222
http: 8222

tls {
  cert_file: "/etc/nats/certs/server-cert.pem"
  key_file: "/etc/nats/certs/server-key.pem"
  ca_file: "/etc/nats/certs/ca.pem"
  timeout: 2
}

jetstream {
  store_dir: "/data"
  key: ${JETSTREAM_ENCRYPTION_KEY}
}

authorization {
  users: [
    {
      user: flexcore-worker
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: { allow: ["flexcore.v1.>"] }
        subscribe: { allow: ["flexcore.v1.>", "_INBOX.>"] }
      }
    },
    {
      user: flexcore-source
      password: $NATS_SOURCE_PASSWORD
      permissions: {
        publish: { allow: ["flexcore.v1.telemetry.>"] }
        subscribe: { deny: [">"] }
      }
    },
    {
      user: flexcore-control-plane
      password: $NATS_CONTROL_PLANE_PASSWORD
      permissions: {
        publish: { allow: ["flexcore.v1.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
