# P12.02 — pgBackRest stanza config SHAPE (WRITTEN-UNRUN; P12.01 DEFAULT
#          selection). No tool is installed; no value here was ever loaded by
#          pgBackRest. Option NAMES are UNVERIFIED against the deployed
#          pgBackRest version [S-68] — verify each at deployment and record
#          the pinned version. Every site value is a <PLACEHOLDER> filled only
#          by the deployment's authoritative copy (never edited in place —
#          the versioned, additive-file rule). No secret value appears here:
#          S3 credentials and the repo cipher passphrase are deployment
#          secret-management inputs (P11.16; the pgBackRest environment
#          variables or a 0600 passphrase file are the recorded delivery
#          mechanisms — UNVERIFIED, verify against the pinned version).
#
# Cadence: this file carries NO schedule. The backup cadence each run uses
# comes from the P12.04 register (RECOMMENDATIONS, sign-off cell EMPTY).

[global]
# Object-storage repo (the P12.01 §4 target shape). S3-compatible endpoint
# is a deployment input; residency constraint stays EMPTY until D1 closes
# (P9.10 §4/§7).
repo1-type=s3
repo1-s3-bucket=<PLACEHOLDER>
repo1-s3-endpoint=<PLACEHOLDER>
repo1-s3-region=<PLACEHOLDER>
repo1-path=/pgbackrest/repo1

# Encryption at rest: the mechanism cell is <EMPTY — deployment decision>
# (P12.01 §3). The repo-cipher route below is the RECOMMENDED shape; the
# passphrase NEVER lives in this file.
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass: supplied at runtime via secret management — never here.

# Retention: no period without a cited basis (P9.10 §6). The cells below
# stay <PLACEHOLDER> until the P9.10 §6 rows are filled and the human
# owner derives the repo-retention values from them.
repo1-retention-full=<PLACEHOLDER>
repo1-retention-diff=<PLACEHOLDER>

# Parallel backup (the P12.01 §2 DEFAULT rationale). Process count is a
# sizing decision — <PLACEHOLDER>, never assumed.
process-max=<PLACEHOLDER>

start-fast=y
compress-type=zst
log-level-console=info
log-level-file=info

# WAL archiving timeout bounds how long a completed segment may wait
# before archive-push reports failure — the achievable-RPO input the
# P12.04 register consumes. Value <PLACEHOLDER>.
archive-timeout=<PLACEHOLDER>

[flexcore]
# Stanza: one per deployment. PGDATA is a <PLACEHOLDER>; the Compose dev
# stack keeps data in the postgres-data volume (../docker-compose.yml) —
# a real deployment names its own path. The postgresql.conf-side settings
# (archive_mode on, archive_command = 'pgbackrest --stanza=flexcore
# archive-push %p', wal_level=replica) are DEPLOYMENT configuration and are
# recorded in record 02 §3 — they are not set by any file in this
# repository.
pg1-path=<PLACEHOLDER>
pg1-port=5432
# Runtime backup role: a deployment decision (P1.12 §3 role model — the
# migrator/maintenance roles own DDL; backups run under the deployment's
# designated backup role). <PLACEHOLDER>.
pg1-user=<PLACEHOLDER>
