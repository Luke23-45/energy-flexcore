# P1.19 — flexcore-worker: background worker binary (composition root).
#
# Separate process per report §8.3: the outbox publisher (P1.15) and the
# idempotent consumers (P1.16) are long-lived background work distinct from
# request handling, so they get their own process now (justification recorded
# in README.md). The worker hosts library types from flexcore-nats-adapter
# and owns the durable PostgreSQL inbox store until it is promoted into
# flexcore-postgres-adapter (single-home decision recorded in src/inbox.rs).
[package]
name = "flexcore-worker"
description = "Background worker: outbox publisher + event consumers (P1.19)."
version.workspace = true
edition.workspace = true

[dependencies]
# Composition-root infrastructure (allowed here; core crates may not).
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
async-nats = { workspace = true }
serde_json = { workspace = true }
# Patch B (P2.07): the ephemeral dev-key keypair is generated at startup
# (`SigningKey::generate` needs the `rand_core` feature, on the workspace
# pin) and the dev verifying-key bytes feed the envelope authenticator.
ed25519-dalek = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# P11.05 (Phase 11 wave 1, Agent A) — OpenTelemetry SDK + OTLP export for
# the worker's trace propagation seam and optional span export. Signal
# maturity per [S-63]: metrics + logs Stable, traces Beta. Versions
# checked against crates.io / the opentelemetry-rust releases page on
# 2026-11-14 (same pinned set as apps/control-plane, P11.04).
# ASSUMPTION (recorded, records/05_p11_05_otel_python_and_trace_headers.md):
# this pinned set compiles together — verified ONLY at the first human
# build, which has never run.
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.34.0"

# FIM-F10 (wave 7, Agent B) — the vendor-generic weather/price ingestion
# adapter's HTTP fetch path (src/vendor_ingestion.rs). reqwest 0.13.5 is
# ALREADY in the committed Cargo.lock (transitive); this promotes it to a
# direct edge at the SAME lock version — the lock-promotion note per the
# FIM dependency policy (no new crate enters the resolution graph; the
# lock regeneration at the first human build adds only the direct edge).
# The feature set mirrors the control-plane's wave-4 reqwest edge verbatim
# (default-features off; blocking for the sync-port bridge; rustls without
# a compiled-in provider — the CryptoProvider install is a DEPLOYMENT
# concern recorded in the vendor_ingestion module header).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls-no-provider"] }
# - rustls 0.23.46 (lock): the CryptoProvider install for the reqwest
#   `rustls-no-provider` edge above (Batch 68 — without it every client
#   build panics at first use: "No rustls crypto provider is
#   configured"). `ring` keeps the resolved provider IDENTICAL to the
#   committed lock graph (FIM standing decision 1: aws-lc-rs is not in
#   the lock). Same declaration as the protocol-openadr edge.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12"] }
# FIM-F10 — the forecast artifact digest chain (SHA-256, FIM-F10.04; the
# P15.06 chain shape upgraded from the test-grade FNV-1a 64 per the FIM
# instruction). Workspace-catalogued crate (sha2 = "0.11"), already in the
# committed Cargo.lock at 0.11.1; no new version pin.
sha2 = { workspace = true }

# Internal crates.
flexcore-contracts = { workspace = true }
flexcore-domain = { workspace = true }
flexcore-events = { workspace = true }
flexcore-application = { workspace = true }
flexcore-ports = { workspace = true }
# P11.12 (Phase 11 wave 1, Agent B) — the command consumer reads the
# command lifecycle through the storage port (`CommandRecordStore`);
# workspace-catalogued crate, no new version pin. Recorded in the P11.12
# decision record.
flexcore-storage = { workspace = true }
# P2.10 step 5 composition: the simulator source is the first
# TelemetrySource implementation, wired HERE (composition root) only —
# the ingestion pipeline itself compiles against the port (port-only
# rule). See main.rs compose_ingestion.
flexcore-simulator = { workspace = true }
flexcore-nats-adapter = { workspace = true }
flexcore-postgres-adapter = { workspace = true }

[dev-dependencies]
# Patch B: the sibling test worker's source-auth tests sign envelopes
# with ephemeral keypairs and need the same crates as the production
# path (plus an RNG for the test keypairs): ed25519-dalek + rand for
# keypairs/signing, sha2 for envelope digests, base64 for payload
# encode/decode.
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# P2.20: the maintenance test builds partition bounds as OffsetDateTime.
time = { workspace = true }

[[bin]]
name = "flexcore-worker"
path = "src/main.rs"
