# P1.17 — Axum control-plane API (composition root).
# P1.21 — configuration/secrets handling lives here (config.rs).
# P1.22 — health/readiness probes and graceful shutdown live here.
#
# The `dev-auth` feature is the ONLY authentication integration in Phase 1:
# a test/dev-profile-gated identity resolver (ledger P1.17 step 3). It is
# NOT a default feature and must never be enabled in release builds — CI
# (P1.27) fails if it appears in default features, and the middleware
# denies every unauthenticated request when the feature is absent.
[package]
name = "flexcore-control-plane"
description = "Axum control-plane API; composition root (P1.17)."
version.workspace = true
edition.workspace = true

[features]
default = []
# Dev/test-only authentication resolver. NEVER enable in release builds.
dev-auth = []

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
# `util` is needed for `tower::ServiceExt::oneshot` (integration tests).
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
utoipa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# P11.04 — OpenTelemetry SDK + OTLP export (Phase 11 wave 1, Agent A).
# Signal maturity per [S-63]: metrics + logs Stable, traces Beta. Versions
# checked against crates.io / the opentelemetry-rust releases page on
# 2026-11-14 (opentelemetry 0.33.1 is the latest release tag; the SDK and
# OTLP crates ship in coordinated 0.33.x waves; tracing-opentelemetry
# 0.34.0 published 2026-09-23 depends on opentelemetry ^0.33.0 and
# tracing ^0.1.35 — compatible with the workspace's tracing 0.1.44 /
# tracing-subscriber 0.3.23). ASSUMPTION (recorded, records/
# 04_p11_04_otel_tracing_rust.md): this pinned set compiles together —
# verified ONLY at the first human build, which has never run.
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry_sdk = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs"] }
tracing-opentelemetry = "0.34.0"
opentelemetry-appender-tracing = "0.33.1"
# P13.02 — JWT validation for the OIDC identity resolver (oidc.rs, Phase 13
# wave 1, Agent A). Pin: jsonwebtoken 11.1.0 — verified to exist on
# crates.io on 2026-11-14 (published 2026-09-16; a 12.0.0 was published
# 2026-11-13, one day before this edit, and was deliberately NOT taken:
# a same-week 0.x→12 major line jump is not a reviewed pin). ASSUMPTION
# (recorded, phase-13 records/02_p13_02_oidc_token_validation.md): this
# pin compiles together with the workspace (MSRV 1.88 per the crate page)
# and the API surface the resolver uses (decode_header, Validation
# set_issuer/set_audience/leeway, DecodingKey::from_jwk, JwkSet::find) —
# verified ONLY at the first human build, which has never run. No other
# new dependency was added: the JWKS fetch is an injected port (no HTTP
# client in the resolver), keeping network behavior out of this repo.
jsonwebtoken = "11.1.0"
flexcore-contracts = { workspace = true }
flexcore-domain = { workspace = true }
flexcore-ports = { workspace = true }
flexcore-application = { workspace = true }
flexcore-events = { workspace = true }
flexcore-authz = { workspace = true }
# P3.28 — the Phase 3 record-store contracts (ScheduleRecordStore,
# ScheduleRevisionChainStore, EnvelopeRecordStore) surface in the
# unit-of-work bundle (state.rs); the traits live in flexcore-storage
# (the recorded D-P3.21-4 home).
flexcore-storage = { workspace = true }
flexcore-postgres-adapter = { workspace = true }
flexcore-nats-adapter = { workspace = true }
# RFC 3339 rendering of canonical event timestamps in the DTO layer (dto.rs).
time = { workspace = true }
# Broker readiness: the composition root opens the core async-nats client
# directly. The NATS adapter crate hosts the publisher/consumer (P1.15,
# P1.16), not a client wrapper, so there is no adapter type to reuse.
async-nats = { workspace = true }
# P5.25 — the SSE live stream: `BroadcastStream` (the "sync" feature) turns
# the live bus's broadcast receivers into the axum SSE stream, and
# `tokio_stream::StreamExt` drives the composition root's NATS forwarder.
# UNPINNED major-line pin ("0.1", the recorded serde/serde_json/time
# precedent — RESEARCH.md does not name a version): the exact version is
# resolved in the first lockfile and re-verified there. Decision record:
# ledger/phase-05-operator-console-simulator/01_25_scaffold_live.md.
tokio-stream = { version = "0.1", features = ["sync"] }

# Integration tests compose the Test-variant backend with the ports fakes
# (flexcore-ports is already a runtime dependency; no test-only edge).

# P2.19/P2.25 DB-gated integration tests (telemetry_history.rs,
# exit_portfolio.rs) bootstrap roles/partitions with sqlx directly.
# Dev-only edge: the composition root itself stays sqlx-free in runtime
# code (storage goes through flexcore-postgres-adapter).
[dev-dependencies]
sqlx = { workspace = true }

[[bin]]
name = "flexcore-control-plane"
path = "src/main.rs"
