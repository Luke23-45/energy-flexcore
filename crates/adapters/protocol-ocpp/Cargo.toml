# P17.01 — flexcore-ocpp-adapter manifest: the OCPP CSMS adapter crate.
#
# Composition-side crate (`tools/check_dependency_rule.py`, P14.01
# classification): adapters may use infrastructure, but this crate
# deliberately adds NONE. Dependency justification:
# - flexcore-protocol-ports (P14.01): the common protocol scope declaration,
#   capability manifest, and connection lifecycle every protocol adapter
#   implements — this crate is the OCPP-CSMS instantiation.
# - flexcore-domain: the protected 14-state command lifecycle
#   (`command_state.rs`), the EVSE registry extension (`evse_registry.rs`,
#   P17.04), and the smart-charging composer plan types
#   (`ev_charging_composer.rs`, P17.05). The external-event mapping types its
#   output with the real frozen `CommandState` (external input enters at
#   PROPOSED only) and the relay mapping is typed so a charging profile can
#   only be built from an ISSUED lifecycle state — the command-relay-only
#   rule is enforced by types, not by convention (phase-17 context §3
#   constraint 1; plan §7.4).
# - serde / serde_json (workspace pins): the OCPP-J JSON framing codec and
#   the message payload model types. The wire encoding is plain JSON over
#   WebSocket per the OCPP-J rules [S-121] — every field name and message
#   shape below carries an UNVERIFIED label naming the implementation-time
#   check against the OCA specification text.
#
# What remains deliberately absent: NO third-party WebSocket library
# (tokio-tungstenite/tokio-websockets are NOT added) and NO TLS stack. The
# RFC 6455 server-side transport was implemented under FIM-F02 as a
# HAND-WRITTEN minimal codec (`src/websocket.rs`), per the FIM standing
# decision 1 (docs/releases/implementation_ledger/README.md): missing wire
# protocols are hand-written minimal codecs pinned by tests, each carrying
# an honesty header — RFC 6455 conformance and real charge-point
# interoperability are HUMAN LAB GATES, never claimed here. SHA-1 (the
# RFC 6455 |Sec-WebSocket-Accept| hash) is likewise hand-written and pinned
# (`src/sha1.rs`); no sha* crate is added. No TLS termination exists
# anywhere: the transport serves plaintext RFC 6455 in the declared
# LAB posture with a recorded reason, and Profile 3 mTLS termination is a
# HUMAN LAB GATE (there is no flag that disables TLS, because no TLS was
# ever enabled). The entire crate remains WRITTEN-UNRUN; no server has ever
# run, no charge point has ever connected, no OCPP message has ever been
# exchanged with a real device, and no conformance or certification claim
# is made.
#
# Dependency additions under FIM-F02 (lock-verified, FIM standing decision
# 1 — dependencies are limited to crates already resolved in the committed
# Cargo.lock):
# - tokio (workspace pin 1.54.1, resolved in Cargo.lock as 1.54.1): the
#   live transport's bind/serve loop (`transport.rs`); the workspace pin
#   already carries the features used (net, rt-multi-thread, macros, sync,
#   io-util, time).
# - base64 (workspace pin 0.23, resolved in Cargo.lock as 0.23.1): the
#   RFC 6455 |Sec-WebSocket-Key| / |Sec-WebSocket-Accept| header encoding.
[package]
name = "flexcore-ocpp-adapter"
description = "OCPP CSMS adapter: OCPP-J JSON framing model types and codec, subprotocol negotiation, connection/session state machine, security Profile 3 onboarding types, boot/status/transaction mapping into the domain EVSE registry extension, and the SetChargingProfile payload mapping for the smart-charging composer (P17.01-P17.05)."
version.workspace = true
edition.workspace = true

[dependencies]
flexcore-protocol-ports = { workspace = true }
flexcore-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# FIM-F02 (lock-verified): the live RFC 6455 transport's serving loop.
tokio = { workspace = true }
# FIM-F02 (lock-verified, lock resolves workspace pin 0.23 -> 0.23.1): the
# RFC 6455 handshake key encoding (|Sec-WebSocket-Key| decode,
# |Sec-WebSocket-Accept| encode).
base64 = { workspace = true }
