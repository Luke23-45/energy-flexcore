# P1.03 — FlexCore Cargo workspace (Phase 1)
#
# Report §8.1/§8.2: modular monolith, hexagonal dependency rule.
# Members are exactly the crates with real Phase 1 code (P1.03 step 3);
# no future crate (flexcore-kernel, optimization/grid APIs) is listed.
#
# Dependency policy: see `tools/check_dependency_rule.py` (P1.04) and
# `ledger/phase-01-rust-foundation/` for the policy document. Adapters and
# apps may use infrastructure; the eight core crates may not.
#
# License field: deliberately UNSET — the repository has no license file and
# D4 (license and dependency audit) is OPEN. Apache-2.0 is a recommendation,
# not a decision (`.agent/DECISIONS.md`). Set `license` or `license-file`
# only when D4 closes.
#
# Version pins come from `ledger/phase-01-rust-foundation/RESEARCH.md`
# (checked 7 November 2026). serde/serde_json/time carry only a major-line
# pin because RESEARCH.md did not record an exact version for them — the
# human resolves the exact version in the first `Cargo.lock` and records it
# (RESEARCH.md §8 open verification task 1).

[workspace]
resolver = "2"
members = [
    "crates/flexcore-contracts",
    "crates/flexcore-domain",
    "crates/flexcore-ports",
    "crates/flexcore-application",
    "crates/flexcore-events",
    "crates/flexcore-storage",
    "crates/flexcore-audit",
    "crates/flexcore-authz",
    "crates/flexcore-optimization-api",
    "crates/flexcore-grid-api",
    "crates/adapters/postgres",
    "crates/adapters/nats",
    "crates/flexcore-simulator",
    # P6.05 — the edge agent: a COMPOSITION crate (like apps/worker); see
    # ledger/phase-06-edge-protocol/05_12_20_edge_foundation.md for the
    # recorded placement (report §8.1 names `apps/edge-agent`; deviation
    # recorded there, not silently absorbed).
    "crates/edge-agent",
    # P7.05/P7.06 — the plugin kernel: versioned plugin manifest validation
    # and deterministic dependency resolution (report §8.1/§8.2; see
    # ledger/phase-07-plugin-sdk/05_06_manifest_resolution.md). Classified a
    # COMPOSITION crate in tools/check_dependency_rule.py, like apps/worker.
    # Registry (P7.08), lifecycle (P7.07), and permission enforcement are
    # later subtasks — only real code is listed (P1.03 rule). This member
    # supersedes the P1.03 header note above for flexcore-kernel only.
    "crates/flexcore-kernel",
    "apps/control-plane",
    "apps/sim-runner",
    "apps/worker",
    # P7.10/P7.11 — the WASM plugin host: the constrained component-model
    # host prototype as a SEPARATE process (report §8.3: the WASM host is
    # extracted for security isolation) plus the capability broker. A
    # COMPOSITION crate in tools/check_dependency_rule.py (like apps/worker);
    # its wasmtime =50.0.1 pin and the D4/CVE note live in its own
    # apps/plugin-host/Cargo.toml (this root edit is the additive member
    # entry only; see ledger/phase-07-plugin-sdk/10_11_plugin_host_broker.md).
    "apps/plugin-host",
    # P8.04–P8.06 — flexcore-research: the Phase 8 independent validation
    # harness (P8.05, the validator that does not trust the researcher) and
    # the frozen deterministic baseline registry (P8.06). A COMPOSITION
    # crate in tools/check_dependency_rule.py, like flexcore-kernel and
    # apps/plugin-host: it composes the platform's EXISTING seams (the
    # §12.5 feasibility gate as an INJECTED port, the §12.6 result
    # vocabulary, the §13.4 proposal vocabulary) rather than defining a new
    # core contract; the core-crate edge policy does not apply to it, and
    # NO core crate may depend on it. serde/serde_json only — no solver, no
    # transport, no async runtime (the placement rationale is recorded in
    # ledger/phase-08-advanced-coordination/05_06_harness_baselines.md).
    "crates/flexcore-research",
    # P14.01 — the common protocol-adapter port layer (scope declaration,
    # capability manifest, connection lifecycle) that every
    # crates/adapters/protocol-* crate implements. A CORE crate in
    # tools/check_dependency_rule.py (allowed internal edges: none);
    # serde-only dependency line (decision record
    # docs/phases-11-20/phase-14-protocol-device-connectivity/records/
    # 01_p14_01_adapter_architecture.md).
    "crates/flexcore-protocol-ports",
    # P14.02 — the IEEE 2030.5 AggregatorServer adapter: CSIP resource-tree
    # model types, declared addressing/query semantics, the mTLS server
    # skeleton with a designed (UNRUN) transport seam, and the
    # DERControl-to-PROPOSED external-event mapping. A COMPOSITION crate in
    # tools/check_dependency_rule.py; no transport dependency (the seam is
    # an implementation-time human gate, decision record 02).
    "crates/adapters/protocol-20305",
    # P14.05 (wave 1, Agent B) — the OpenADR 3.0 VTN adapter: event/report/
    # registration endpoint DESIGN as data (no HTTP framework), the VEN
    # registry + delivery planner, and the event-to-PROPOSED lifecycle
    # mapping. A COMPOSITION crate in tools/check_dependency_rule.py; no
    # transport dependency (endpoint serving is a designed seam, decision
    # record 21).
    "crates/adapters/protocol-openadr",
    # P14.07 (wave 1, Agent B) — the SunSpec Modbus client adapter:
    # information-model types (101/103, 201/203, 80x), the register-map
    # registry keyed per device model, gateway polling budgets, unit
    # conversion at the adapter boundary, and the UNWIRED TCP/RTU transport
    # seam. A COMPOSITION crate in tools/check_dependency_rule.py (decision
    # record 23).
    "crates/adapters/protocol-modbus",
    # P14.08 (wave 1, Agent B) — the DNP3 IEEE 1815.2-2025 DER-profile
    # adapter: DER data-object types, the OUTSTATION-role model (controls
    # arriving from the master enter the lifecycle at PROPOSED), the
    # master-role assessment (DEFER record), and the secure-transport
    # posture note (no claims). A COMPOSITION crate in
    # tools/check_dependency_rule.py (decision record 24).
    "crates/adapters/protocol-dnp3",
    # P14.11 (wave 2, Agent A) — the MQTT 5 + Sparkplug B edge-transport
    # adapter: the declared topic namespace, the Sparkplug B payload model,
    # the BIRTH/DEATH session state machine, per-device credential bindings
    # (no secret field — the never-granted rule), the edge-agent uplink
    # OPTION design, and the UNWIRED MQTT wire seam. A COMPOSITION crate in
    # tools/check_dependency_rule.py; no MQTT client / broker / async
    # runtime dependency (decision record 43).
    "crates/adapters/protocol-mqtt",
    # P14.12 (wave 2, Agent A) — the CIM/CGMES network-model import
    # adapter: the CIM object vocabulary, the RDF/XML profile-source SEAM
    # (no XML parser dependency), the declared class mapping into the
    # grid-api network IR with the EXPLICITLY_UNMAPPED discipline, the
    # IEC 61968-5 DER-group registry, and the common scope declaration. A
    # COMPOSITION crate in tools/check_dependency_rule.py (decision
    # record 44). P14.09 (IEC 60870-5-104) and P14.10 (IEC 61850-7-420)
    # are design-record-only in wave 2 per the P14-E-3 DEFAULT — no
    # protocol-104/protocol-61850 crates exist (records 41/42).
    "crates/adapters/protocol-cim",
    # P15.04 — the ENTSO-E Transparency Platform price-signal ingestion
    # adapter: the A44 day-ahead price document model, the document
    # extraction seam (no XML parser dependency — the P14.12 precedent),
    # the API-token HUMAN GATE boundary (UNSIGNED until a human
    # registers), the UNWIRED REST transport seam (no HTTP client; no
    # request is ever sent in this program), and the ingest-only scope
    # (prices are INGESTED DATA, never bid inputs — ADR-010 extension,
    # ADR-011 unchanged). A COMPOSITION crate in
    # tools/check_dependency_rule.py; zero external dependencies
    # (decision record
    # docs/phases-11-20/phase-15-forecasting-asset-intelligence/records/
    # 04_p15_04_price_ingestion_entsoe.md).
    "crates/adapters/protocol-entsoe",
    # P17.01-P17.05 (wave 1, Agent A) — the OCPP CSMS adapter: OCPP-J JSON
    # framing model types and codec, subprotocol negotiation (ocpp2.0.1
    # baseline + ocpp2.1 additive, P17-E-1 DEFAULT OPEN), the session state
    # machine, the CSMS server skeleton with a designed (UNRUN) WebSocket
    # transport seam, security Profile 3 onboarding types, the
    # boot/status/transaction mapping into the domain EVSE registry
    # extension, and the SetChargingProfile payload mapping for the
    # smart-charging composer. A COMPOSITION crate in
    # tools/check_dependency_rule.py; no WebSocket / TLS / HTTP dependency
    # (the transport is a designed seam, decision record 01).
    "crates/adapters/protocol-ocpp",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
# `license` intentionally omitted — D4 open (see header comment).

[workspace.dependencies]
# Async runtime (RESEARCH.md §2 — Tokio 1.54.1; never 1.54.0, CVE-2026-115567).
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "net",
    "sync",
    "io-util",
] }
# HTTP API (RESEARCH.md §3 — Axum 0.8.9, MSRV 1.80).
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "timeout", "limit-request"] }
# Persistence (RESEARCH.md §4 — SQLx 0.9.0, MSRV 1.94.0; offline mode always on).
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "time",
    "json",
] }
# Messaging (RESEARCH.md §5 — async-nats 0.50.0; NATS server 2.15.x).
async-nats = "0.50.0"
# Serialization (exact versions resolved in the first lockfile; see header).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Timestamps in contracts (ledger P1.05 names "chrono/time"; `time` chosen —
# exact version resolved in the first lockfile and recorded, RESEARCH.md §8/§7).
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
# Observability (RESEARCH.md §7 — tracing 0.1.44 / tracing-subscriber 0.3.23;
# secondary-source pins, re-verify at build time).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# OpenAPI (RESEARCH.md §7 — utoipa 5.5.0; utoipa-gen is a separate version
# line, do not pin it independently).
utoipa = { version = "5.5.0", features = ["axum_extras"] }
# Tier 2 convex-conic solver (RESEARCH.md §2 — Clarabel.rs 0.11.1, the native
# Rust crate; NOT the R package 0.11.3). LP/QP/SOCP/SDP/expo/power cones;
# NO integer variables — never MISOCP (P3.18 discipline).
clarabel = "=0.11.1"

# Internal crates (single version source for the workspace).
flexcore-contracts = { path = "crates/flexcore-contracts" }
flexcore-domain = { path = "crates/flexcore-domain" }
flexcore-ports = { path = "crates/flexcore-ports" }
flexcore-application = { path = "crates/flexcore-application" }
flexcore-events = { path = "crates/flexcore-events" }
flexcore-storage = { path = "crates/flexcore-storage" }
flexcore-audit = { path = "crates/flexcore-audit" }
flexcore-authz = { path = "crates/flexcore-authz" }
flexcore-optimization-api = { path = "crates/flexcore-optimization-api" }
flexcore-grid-api = { path = "crates/flexcore-grid-api" }
flexcore-postgres-adapter = { path = "crates/adapters/postgres" }
flexcore-nats-adapter = { path = "crates/adapters/nats" }
flexcore-simulator = { path = "crates/flexcore-simulator" }
# P6.05 — edge agent (composition crate; port holder for the P6.12
# `EmsAdapter` interface that later `crates/adapters/<protocol>` crates implement).
flexcore-edge-agent = { path = "crates/edge-agent" }
# P7.05+ — plugin kernel (composition crate; its own dependency line pins
# flexcore-protocol-ports via this table). Added to the table by wave 3,
# Agent A (P14.17): the simulated protocol counterparts in
# flexcore-simulator bind the SAME kernel-side adapter-permission checks
# their real counterparts pass (decision record 81; composition→composition
# edge, checker-legal).
flexcore-kernel = { path = "crates/flexcore-kernel" }

# P14.01/P14.02 — protocol adapter crates (single version source; see the
# member notes above and the phase-14 records for the placement rationale).
flexcore-protocol-ports = { path = "crates/flexcore-protocol-ports" }
flexcore-protocol-20305 = { path = "crates/adapters/protocol-20305" }
# P14.05/P14.07/P14.08 (wave 1, Agent B) — protocol adapter crates (single
# version source; see the member notes above and the phase-14 records for
# the placement rationale).
flexcore-openadr-adapter = { path = "crates/adapters/protocol-openadr" }
flexcore-modbus-adapter = { path = "crates/adapters/protocol-modbus" }
flexcore-dnp3-adapter = { path = "crates/adapters/protocol-dnp3" }
# P14.11/P14.12 (wave 2, Agent A) — protocol adapter crates (single
# version source; see the member notes above and the phase-14 records for
# the placement rationale).
flexcore-mqtt-adapter = { path = "crates/adapters/protocol-mqtt" }
flexcore-cim-adapter = { path = "crates/adapters/protocol-cim" }
# P15.04 — the ENTSO-E price-signal ingestion adapter (single version
# source; see the member note above and the phase-15 records).
flexcore-entsoe-adapter = { path = "crates/adapters/protocol-entsoe" }
# P17.01-P17.05 — the OCPP CSMS adapter crate (single version source; see
# the member note above and the phase-17 records for the placement
# rationale).
flexcore-ocpp-adapter = { path = "crates/adapters/protocol-ocpp" }

# Patch policy: no [patch] entries without an ADR and a recorded upstream
# issue (P1.03 step 5).
